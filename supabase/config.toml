
[functions.send-invoice-email]
enabled = true
verify_jwt = true
import_map = "./functions/send-invoice-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-invoice-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-invoice-email/*.html" ]

[functions.invite-user]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-user/index.ts"

[functions.notify-admin]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-admin/index.ts"

[functions.admin-create-user]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-create-user/index.ts"

[functions.sync-officegest]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-officegest/index.ts"

[functions.sislog-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/sislog-webhook/index.ts"

[functions.process-subscription-payment]
enabled = true
verify_jwt = true
entrypoint = "./functions/process-subscription-payment/index.ts"


[functions.ai-assistant]
enabled = true
verify_jwt = true
import_map = "./functions/ai-assistant/deno.json"
entrypoint = "./functions/ai-assistant/index.ts"

# verify_jwt = false porque esta função tem dois modos: o agendado, que se
# autentica por x-cron-secret e não traz JWT, e o por empresa, cujo JWT é
# validado dentro da própria função.
[functions.ai-alerts]
enabled = true
verify_jwt = false
import_map = "./functions/ai-alerts/deno.json"
entrypoint = "./functions/ai-alerts/index.ts"
