name: Android → Google Play

# Cada push para main publica no track "internal" (testadores internos, sem revisão da Google).
# Uma tag v* (ex.: v1.2.0) publica a mesma build em "production".
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "**/*.md"
      - "ios/**"
      - "codemagic.yaml"
  workflow_dispatch:

# Um push novo cancela a build anterior ainda em curso.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-android:
    name: Build & upload AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web & sync Android
        run: npx ng build && npx cap sync android

      - name: Version
        id: version
        run: |
          # versionCode tem de crescer em cada upload; o offset fica acima do último publicado à mão (2).
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "track=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "track=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode & check keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret em falta ou vazio: ANDROID_${v/STORE_PASSWORD/KEYSTORE_PASSWORD}"; exit 1; }
          done
          # Aceita base64 com quebras de linha ou com cabeçalhos -----BEGIN/END----- (certutil no Windows).
          printf '%s' "$KEYSTORE_BASE64" | grep -v -- '-----' | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 não é base64 válido"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore inválido, ANDROID_KEYSTORE_PASSWORD errada ou alias '$KEY_ALIAS' inexistente"; exit 1; }
          echo "Keystore OK (alias $KEY_ALIAS)"

      - name: Build Android App Bundle (AAB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Check Google Play credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICES_JSON_KEY }}
        run: |
          [ -n "$PLAY_JSON" ] || { echo "::error::Secret em falta ou vazio: PLAY_SERVICES_JSON_KEY (JSON da service account da Google Play)"; exit 1; }
          printf '%s' "$PLAY_JSON" | jq -e '.type == "service_account" and .client_email and .private_key' > /dev/null \
            || { echo "::error::PLAY_SERVICES_JSON_KEY não é o JSON de uma service account (cole o ficheiro .json inteiro)"; exit 1; }
          echo "Service account: $(printf '%s' "$PLAY_JSON" | jq -r .client_email)"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICES_JSON_KEY }}
          packageName: com.ispcfacilmz.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.version.outputs.track }}
          status: completed

      - name: Keep AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
