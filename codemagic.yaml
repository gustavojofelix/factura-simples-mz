workflows:
  ios-app-store:
    name: iOS App Store Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2  # Runner macOS gratuito no plano free

    integrations:
      app_store_connect: ISPC Facil ASC   # nome da API key em Codemagic → Team settings → Integrations

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ispcfacilmz.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag           # dispara quando fazeres: git tag v1.0.0 && git push --tags
      tag_patterns:
        - pattern: "v*"
          include: true
      # Ou remove o "triggering" para disparar manualmente pelo painel Codemagic

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build Angular (web assets)
        script: npm run build

      - name: Sync Capacitor iOS (inclui pod install)
        script: npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set app version from tag
        script: |
          # Usa a tag git como versão (ex: v1.0.2 → 1.0.2); build number incremental do Codemagic
          BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          VERSION=$(echo "${CM_TAG:-v1.0.0}" | sed 's/^v//')
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $VERSION;/" $PBX
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" $PBX
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Build and archive iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true   # true = vai para TestFlight primeiro
        submit_to_app_store: false   # muda para true quando estiveres pronto
        beta_groups:
          - "Internal Testers"
      email:
        recipients:
          - gustavo@ltsmoz.com   # ← muda para o teu email
        notify:
          success: true
          failure: true
