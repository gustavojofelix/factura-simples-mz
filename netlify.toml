[build]
  command = "npm run build"
  publish = "dist/ispc-facil/browser"

# Verificação dos App Links Android (tem de ser JSON, sem redirects).
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
